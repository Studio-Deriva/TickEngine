plugins {
	id 'eclipse'
	id 'idea'
	id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
	id 'org.spongepowered.mixin' version '0.7.+'
}

base {
	archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
	gametest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

configurations {
	gametestImplementation.extendsFrom implementation
	gametestCompileOnly.extendsFrom compileOnly
	gametestRuntimeOnly.extendsFrom runtimeOnly
}

minecraft {
	mappings channel: 'official', version: project.minecraft_version
	copyIdeResources = true

	runs {
		configureEach {
			workingDirectory project.file('run')
			property 'forge.logging.console.level', 'info'
			mods {
				tickengine {
					source sourceSets.main
				}
			}
		}
		// TickEngine is server-side only: run a dedicated server for development.
		server {
			args '--nogui'
		}
		// Only for testing against the dev server: TickEngine itself does nothing on the client.
		client {
			workingDirectory project.file('run-client')
		}
		// In-game tests (src/gametest, not shipped): ./gradlew runGameTestServer
		gameTestServer {
			workingDirectory project.file('run-gametest')
			property 'forge.enabledGameTestNamespaces', 'tickengine'
			mods {
				tickengine {
					source sourceSets.gametest
				}
			}
		}
	}
}

test {
	useJUnitPlatform()
}

mixin {
	add sourceSets.main, 'tickengine.refmap.json'
	config 'tickengine.mixins.json'
}

repositories {
	mavenCentral()
}

jarJar.enable()

dependencies {
	minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

	// Forge 1.20.1 does not ship MixinExtras: bundle it (~100 KB).
	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixin_extras_version}"))
	implementation(jarJar("io.github.llamalad7:mixinextras-forge:${project.mixin_extras_version}")) {
		jarJar.ranged(it, "[${project.mixin_extras_version},)")
	}
}

tasks.named('processResources', ProcessResources).configure {
	def replaceProperties = [
		version: project.version,
		minecraft_version_range: project.minecraft_version_range,
		forge_version_range: project.forge_version_range
	]
	inputs.properties replaceProperties

	filesMatching('META-INF/mods.toml') {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs << "-Xlint:deprecation"
}

java {
	withSourcesJar()
}

tasks.named('jar', Jar).configure {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
	manifest {
		attributes([
			'Specification-Title'     : 'tickengine',
			'Specification-Vendor'    : 'Studio Deriva',
			'Specification-Version'   : '1',
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.version,
			'Implementation-Vendor'   : 'Studio Deriva',
			'MixinConfigs'            : 'tickengine.mixins.json'
		])
	}
	finalizedBy 'reobfJar'
}

tasks.named('jarJar').configure {
	archiveClassifier = ''
	finalizedBy 'reobfJarJar'
}
tasks.named('jar', Jar).configure {
	archiveClassifier = 'slim'
}
