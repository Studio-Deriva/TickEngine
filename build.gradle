plugins {
	id 'fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
}

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Bundled (~12 KB): permission nodes work with LuckPerms when present,
	// and fall back to vanilla operator levels otherwise.
	include(modImplementation("me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}"))
}

loom {
	// TickEngine is server-side only: run a dedicated server for development.
	runs {
		server {
			runDir "run"
		}
		// Only for testing against the dev server: TickEngine itself does nothing on the client.
		client {
			runDir "run-client"
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.compilerArgs << "-Xlint:deprecation"
}
